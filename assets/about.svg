<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/><stop offset="1" stop-color="#1a0b3d"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="big" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="2" y="2" width="1196" height="426" rx="20"/></clipPath>
    <style>
      .line { font: 500 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e6e1ff; }
    </style>
  </defs>
  <rect x="2" y="2" width="1196" height="426" rx="20" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="426" rx="20" fill="url(#dots)"/>
  <g clip-path="url(#card)">
    <rect x="0" y="0" width="1200" height="2" fill="#00f5ff" opacity="0.35" filter="url(#g)">
      <animate attributeName="y" values="0;430;0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(210 215)">
    <circle r="170" fill="url(#halo)">
      <animate attributeName="r" values="150;175;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="138" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="4 14" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle r="118" fill="none" stroke="#ff2bd6" stroke-width="3" stroke-dasharray="120 60 40 60" filter="url(#g)">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="96" fill="#0b0620" stroke="url(#mono)" stroke-width="3" filter="url(#g)"/>
    <text y="30" text-anchor="middle" style="font: 900 84px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px;" fill="url(#mono)" filter="url(#big)">IS</text>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
      <circle cx="138" cy="0" r="6" fill="#00f5ff" filter="url(#g)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="180;-180" dur="14s" repeatCount="indefinite"/>
      <circle cx="118" cy="0" r="5" fill="#ff2bd6" filter="url(#g)"/>
    </g>
  </g>

  <text x="432" y="66" style="font: 700 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 5px;" fill="#00f5ff">// WHO I AM</text>
  <text x="430" y="108" style="font: 900 34px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;" fill="#ffffff" filter="url(#g)">Software Developer <tspan fill="#ff2bd6">·</tspan> Mobile <tspan fill="#ff2bd6">·</tspan> Web</text>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.40s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="30 0;0 0" dur="0.6s" begin="0.40s" fill="freeze"/>
    <path d="M440 145 l7 7 -7 7 -7 -7z" fill="#00f5ff" filter="url(#g)"/>
    <text x="462" y="160" class="line">Hi, I'm <tspan fill="#00f5ff" font-weight="800">Ilyes</tspan>, a software developer based in Hannover, Germany.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.75s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="30 0;0 0" dur="0.6s" begin="0.75s" fill="freeze"/>
    <path d="M440 187 l7 7 -7 7 -7 -7z" fill="#ff2bd6" filter="url(#g)"/>
    <text x="462" y="202" class="line">I build <tspan fill="#ff2bd6" font-weight="800">mobile apps</tspan> with Kotlin &amp; Flutter for Android.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.10s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="30 0;0 0" dur="0.6s" begin="1.10s" fill="freeze"/>
    <path d="M440 229 l7 7 -7 7 -7 -7z" fill="#8b5cf6" filter="url(#g)"/>
    <text x="462" y="244" class="line">I build <tspan fill="#8b5cf6" font-weight="800">web apps</tspan> with Angular, Next.js &amp; TypeScript.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="30 0;0 0" dur="0.6s" begin="1.45s" fill="freeze"/>
    <path d="M440 271 l7 7 -7 7 -7 -7z" fill="#00f5ff" filter="url(#g)"/>
    <text x="462" y="286" class="line">I love turning <tspan fill="#00f5ff" font-weight="800">ideas</tspan> into fast, clean, real-world products.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.80s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="30 0;0 0" dur="0.6s" begin="1.80s" fill="freeze"/>
    <path d="M440 313 l7 7 -7 7 -7 -7z" fill="#ff2bd6" filter="url(#g)"/>
    <text x="462" y="328" class="line">Right now I'm <tspan fill="#ff2bd6" font-weight="800">open for projects</tspan> and new collaborations.</text>
  </g>
  
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.30s" fill="freeze"/>
    <rect x="432" y="362" width="186" height="42" rx="21" fill="#00f5ff" fill-opacity="0.1" stroke="#00f5ff" stroke-opacity="0.7"/>
    <text x="452" y="390" style="font: 900 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;" fill="#00f5ff" filter="url(#g)">25+</text>
    <text x="500" y="389" style="font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px;" fill="#d9d2ff">PROJECTS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.55s" fill="freeze"/>
    <rect x="634" y="362" width="172" height="42" rx="21" fill="#ff2bd6" fill-opacity="0.1" stroke="#ff2bd6" stroke-opacity="0.7"/>
    <text x="654" y="390" style="font: 900 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;" fill="#ff2bd6" filter="url(#g)">3</text>
    <text x="678" y="389" style="font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px;" fill="#d9d2ff">PLATFORMS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.80s" fill="freeze"/>
    <rect x="822" y="362" width="326" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.7"/>
    <text x="842" y="390" style="font: 900 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;" fill="#8b5cf6" filter="url(#g)">10+</text>
    <text x="890" y="389" style="font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px;" fill="#d9d2ff">LANGUAGES &amp; FRAMEWORKS</text>
  </g>
  <circle cx="1050" cy="60" r="7" fill="#22ff88">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="1066" y="65" style="font: 700 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 2px;" fill="#22ff88">AVAILABLE</text>
  <rect x="2" y="2" width="1196" height="426" rx="20" fill="none" stroke="url(#border)" stroke-width="3"/>
</svg>

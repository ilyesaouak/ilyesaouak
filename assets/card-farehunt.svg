<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff2bd6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0620"/><stop offset="1" stop-color="#150a33"/>
    </linearGradient>
    <radialGradient id="corner" cx="1" cy="0" r="0.8">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 800 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
      .desc { font: 400 16px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #c9c3e6; }
      .tag { font: 700 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .5px; }
      .lang { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e6e1ff; }
    </style>
  </defs>
  <rect x="2" y="2" width="456" height="196" rx="16" fill="url(#bg)"/>
  <rect x="2" y="2" width="456" height="196" rx="16" fill="url(#corner)"/>
  <rect x="2" y="2" width="456" height="196" rx="16" fill="none" stroke="url(#border)" stroke-width="2.5"/>
  <text x="24" y="56" class="title" filter="url(#glow)">FareHunt</text>
  <circle cx="426" cy="46" r="6" fill="#ff2bd6">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="426" cy="46" r="6" fill="none" stroke="#ff2bd6" stroke-width="2">
    <animate attributeName="r" values="6;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="24" y="98" class="desc">Cheap flights finder that hunts down</text><text x="24" y="122" class="desc">the best fares. Built with Next.js.</text>
  <rect x="24" y="150" width="79" height="28" rx="14" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="64" y="169" text-anchor="middle" class="tag" fill="#ff2bd6">Next.js</text><rect x="113.39999999999999" y="150" width="47" height="28" rx="14" fill="#ff2bd6" fill-opacity="0.12" stroke="#ff2bd6" stroke-opacity="0.6"/><text x="137" y="169" text-anchor="middle" class="tag" fill="#ff2bd6">Web</text>
  <circle cx="340" cy="164" r="7" fill="#3178C6"/>
  <text x="354" y="169" class="lang">TypeScript</text>
</svg>

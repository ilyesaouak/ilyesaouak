<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <defs>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="translate(18 40)">
    <rect x="-8" y="-8" width="16" height="16" fill="none" stroke="#00f5ff" stroke-width="2.5" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="6s" repeatCount="indefinite"/>
    </rect>
    <circle r="3" fill="#00f5ff"/>
  </g>
  <text x="48" y="51" filter="url(#glow)" style="font: 900 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 5px;" fill="#ffffff">GITHUB STATS</text>
  <rect x="406" y="38" height="3" rx="1.5" width="0" fill="url(#line)">
    <animate attributeName="width" values="0;784;784" keyTimes="0;0.4;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
